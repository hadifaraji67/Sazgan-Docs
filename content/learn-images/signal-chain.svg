<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Vazirmatn,system-ui,sans-serif">
  <rect width="800" height="480" fill="#fff"/>
  <defs><linearGradient id="bx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0F0F4"/><stop offset="1" stop-color="#DCEBEE"/></linearGradient>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0E7C8F"/></marker></defs>
  <g font-size="13" font-weight="600" fill="#0F2230" text-anchor="middle">
    <rect x="40"  y="30" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="140" y="55">بیمار</text><text x="140" y="75" font-size="11" fill="#5E7480" font-weight="400">Patient</text>
    <rect x="40"  y="130" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="140" y="155">الکترودها</text><text x="140" y="175" font-size="11" fill="#5E7480" font-weight="400">Ag/AgCl Electrodes</text>
    <rect x="40"  y="230" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="140" y="255">کابل محافظ</text><text x="140" y="275" font-size="11" fill="#5E7480" font-weight="400">Shielded Cable</text>
    <rect x="40"  y="330" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="140" y="355">تقویت‌کننده</text><text x="140" y="375" font-size="11" fill="#5E7480" font-weight="400">Instrumentation Amp</text>
    <rect x="300" y="130" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="400" y="155">فیلتر بالاگذر</text><text x="400" y="175" font-size="11" fill="#5E7480" font-weight="400">HPF · 0.05 Hz</text>
    <rect x="300" y="230" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="400" y="255">فیلتر پایین‌گذر</text><text x="400" y="275" font-size="11" fill="#5E7480" font-weight="400">LPF · 150 Hz</text>
    <rect x="300" y="330" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="400" y="355">فیلتر ناچ</text><text x="400" y="375" font-size="11" fill="#5E7480" font-weight="400">Notch · 50/60 Hz</text>
    <rect x="560" y="130" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="660" y="155">مبدل A/D</text><text x="660" y="175" font-size="11" fill="#5E7480" font-weight="400">≥ 500 Hz · 16-bit</text>
    <rect x="560" y="230" width="200" height="60" rx="12" fill="url(#bx)" stroke="#0E7C8F" stroke-width="2"/><text x="660" y="255">پردازش دیجیتال</text><text x="660" y="275" font-size="11" fill="#5E7480" font-weight="400">DSP · QRS · Alarm</text>
    <rect x="560" y="330" width="200" height="60" rx="12" fill="#0E7C8F" stroke="#0E7C8F" stroke-width="2"/><text x="660" y="355" fill="#fff">نمایشگر</text><text x="660" y="375" font-size="11" fill="#DCEBEE" font-weight="400">Display · Alarm</text>
  </g>
  <g stroke="#0E7C8F" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="140" y1="90"  x2="140" y2="128"/><line x1="140" y1="190" x2="140" y2="228"/><line x1="140" y1="290" x2="140" y2="328"/>
    <line x1="240" y1="360" x2="298" y2="360"/><line x1="400" y1="330" x2="400" y2="292"/><line x1="400" y1="230" x2="400" y2="192"/>
    <line x1="500" y1="160" x2="558" y2="160"/><line x1="660" y1="190" x2="660" y2="228"/><line x1="660" y1="290" x2="660" y2="328"/>
  </g>

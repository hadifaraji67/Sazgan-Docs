<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Vazirmatn,system-ui,sans-serif">
  <rect width="700" height="500" fill="#fff"/>
  <defs><radialGradient id="el" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3FC1D4"/><stop offset="1" stop-color="#0E7C8F"/></radialGradient></defs>
  <path d="M 200 60 Q 350 40 500 60 L 520 90 L 560 130 L 570 200 L 560 320 L 540 460 L 160 460 L 140 320 L 130 200 L 140 130 L 180 90 Z" fill="#F4F7F9" stroke="#D3DEE1" stroke-width="2"/>
  <line x1="350" y1="80" x2="350" y2="440" stroke="#D3DEE1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="350" y="475" font-size="11" fill="#5E7480" text-anchor="middle">Sternum</text>
  <g>
    <circle cx="150" cy="110" r="14" fill="url(#el)"/><text x="150" y="115" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">RA</text>
    <circle cx="550" cy="110" r="14" fill="url(#el)"/><text x="550" y="115" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">LA</text>
    <circle cx="160" cy="450" r="14" fill="url(#el)"/><text x="160" y="455" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">RL</text>
    <circle cx="540" cy="450" r="14" fill="url(#el)"/><text x="540" y="455" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">LL</text>
  </g>
  <g>
    <circle cx="315" cy="180" r="13" fill="url(#el)"/><text x="315" y="185" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">V1</text>
    <circle cx="385" cy="180" r="13" fill="url(#el)"/><text x="385" y="185" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">V2</text>
    <circle cx="405" cy="230" r="13" fill="url(#el)"/><text x="405" y="235" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">V3</text>
    <circle cx="455" cy="270" r="13" fill="url(#el)"/><text x="455" y="275" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">V4</text>
    <circle cx="500" cy="230" r="13" fill="url(#el)"/><text x="500" y="235" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">V5</text>
    <circle cx="530" cy="280" r="13" fill="url(#el)"/><text x="530" y="285" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">V6</text>
  </g>
  <g font-size="11" fill="#5E7480">
    <text x="30" y="30">RA: Right Arm</text><text x="30" y="46">LA: Left Arm</text><text x="30" y="62">RL: Right Leg</text><text x="30" y="78">LL: Left Leg</text>
    <text x="670" y="30" text-anchor="end">V1–V6: Precordial</text>
